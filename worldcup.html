<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <title>Shadik FIFA World Cup - Luxury Live Sports</title>

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- FontAwesome -->
    <link
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
      rel="stylesheet"
    />
    <link
      rel="shortcut icon"
      href="shadikHyperWeb Favicon.png"
      type="image/x-icon"
    />
    <!-- Google Fonts -->
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap"
      rel="stylesheet"
    />

    <!-- HLS.js for Live Streaming -->
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>

    <script>
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: { sans: ["Inter", "sans-serif"] },
            colors: {
              dark: {
                base: "#030305",
                sidebar: "#000000",
                card: "#0a0a0c",
                text: "#8E939D",
              },
              wc: {
                coral: "#FF3366",
                turquoise: "#00E5FF",
                purple: "#8A2BE2",
                lime: "#CCFF00",
              },
            },
          },
        },
      };
    </script>

    <style>
      body {
        font-family: "Inter", sans-serif;
        background-color: #030305;
        color: white;
        overflow: hidden;
        -webkit-user-select: none;
        user-select: none;
        touch-action: pan-x pan-y;
      }

      ::-webkit-scrollbar {
        display: none;
      }
      * {
        -ms-overflow-style: none;
        scrollbar-width: none;
      }

      .text-gradient-wc {
        background: linear-gradient(
          90deg,
          #ff3366,
          #8a2be2,
          #00e5ff,
          #ccff00,
          #ff3366
        );
        background-size: 400% auto;
        color: transparent;
        -webkit-background-clip: text;
        background-clip: text;
        animation: textShine 8s linear infinite;
        display: inline-block;
        padding-right: 8px;
      }
      @keyframes textShine {
        0% {
          background-position: 0% center;
        }
        100% {
          background-position: -400% center;
        }
      }

      .animated-border {
        background: linear-gradient(
          45deg,
          #ff3366,
          #8a2be2,
          #00e5ff,
          #ccff00,
          #ff3366
        );
        background-size: 300% 300%;
        animation: borderShift 4s ease infinite;
      }
      @keyframes borderShift {
        0% {
          background-position: 0% 50%;
        }
        50% {
          background-position: 100% 50%;
        }
        100% {
          background-position: 0% 50%;
        }
      }

      /* --- HOME CARDS --- */
      .game-card {
        transition: width 0.5s cubic-bezier(0.34, 1.56, 0.64, 1),
          height 0.5s cubic-bezier(0.34, 1.56, 0.64, 1), transform 0.4s ease;
        transform-origin: center bottom;
      }
      .game-card.inactive {
        width: 100px;
        height: 140px;
        z-index: 10;
        transform: translateY(0);
      }
      .game-card.inactive:hover {
        transform: translateY(-2px);
        z-index: 15;
      }
      .game-card.active {
        width: 180px;
        height: 180px;
        transform: translateY(-8px);
        z-index: 30;
        box-shadow: 0 15px 30px -10px rgba(0, 0, 0, 0.9),
          0 0 25px rgba(0, 229, 255, 0.2);
      }

      @media (min-width: 768px) {
        .game-card.inactive {
          width: 150px;
          height: 220px;
        }
        .game-card.inactive:hover {
          transform: translateY(-8px);
        }
        .game-card.active {
          width: 290px;
          height: 290px;
          transform: translateY(-16px);
          box-shadow: 0 30px 60px -15px rgba(0, 0, 0, 0.9),
            0 0 45px rgba(0, 229, 255, 0.25);
        }
      }

      .card-border {
        opacity: 0;
        transition: opacity 0.4s ease;
      }
      .game-card.active .card-border {
        opacity: 1;
      }
      .card-img {
        filter: grayscale(80%) brightness(0.5);
        transition: all 0.5s ease;
        padding: 15px;
      }
      .game-card.inactive:hover .card-img {
        filter: grayscale(20%) brightness(0.9);
        scale: 1.05;
      }
      .game-card.active .card-img {
        filter: grayscale(0%) brightness(1);
        scale: 1.1;
        padding: 25px;
      }

      @media (max-width: 767px) {
        .card-img {
          padding: 8px;
        }
        .game-card.active .card-img {
          padding: 16px;
        }
      }

      .active-ui {
        opacity: 0;
        transition: opacity 0.4s ease;
        pointer-events: none;
      }
      .game-card.active .active-ui {
        opacity: 1;
        transition-delay: 0.2s;
        pointer-events: auto;
      }

      .hero-transition {
        transition: opacity 0.4s ease,
          transform 0.5s cubic-bezier(0.25, 1, 0.5, 1);
      }
      .hero-exit {
        opacity: 0;
        transform: translateY(15px);
        filter: blur(4px);
        pointer-events: none;
        position: absolute;
      }
      .hero-enter {
        opacity: 1;
        transform: translateY(0);
        filter: blur(0);
        pointer-events: auto;
        position: relative;
      }

      /* --- APP VIEW TRANSITIONS --- */
      .app-view {
        transition: transform 0.6s cubic-bezier(0.25, 1, 0.5, 1),
          opacity 0.5s ease;
      }
      #view-home.hidden-state {
        transform: scale(0.95);
        opacity: 0;
        pointer-events: none;
        z-index: 0;
      }
      #view-home.active-state {
        transform: scale(1);
        opacity: 1;
        pointer-events: auto;
        z-index: 20;
      }
      #view-player.hidden-state {
        transform: translateX(100%);
        opacity: 0;
        pointer-events: none;
        z-index: 0;
      }
      #view-player.active-state {
        transform: translateX(0);
        opacity: 1;
        pointer-events: auto;
        z-index: 30;
      }

      /* --- CUSTOM FIFA VIDEO CONTROLS --- */
      #video-container {
        cursor: none;
      }
      #video-container.controls-active {
        cursor: default;
      }

      #video-container:-webkit-full-screen {
        width: 100vw;
        height: 100vh;
        border-radius: 0;
      }
      #video-container:fullscreen {
        width: 100vw;
        height: 100vh;
        border-radius: 0;
      }

      #video-container:-webkit-full-screen .control-fade {
        padding-bottom: 24px;
      }
      #video-container:fullscreen .control-fade {
        padding-bottom: 24px;
      }

      .control-fade {
        opacity: 0;
        transition: opacity 0.3s ease;
        pointer-events: none;
      }
      #video-container.controls-active .control-fade {
        opacity: 1;
        pointer-events: auto;
      }

      /* Premium FIFA Theme Range Slider */
      input[type="range"] {
        -webkit-appearance: none;
        width: 100%;
        background: transparent;
        cursor: pointer;
      }
      input[type="range"]:focus {
        outline: none;
      }
      input[type="range"]::-webkit-slider-runnable-track {
        width: 100%;
        height: 6px;
        background: rgba(255, 255, 255, 0.2);
        border-radius: 3px;
        box-shadow: 0 0 10px rgba(0, 0, 0, 0.5);
      }
      /* Football Thumb */
      input[type="range"].fifa-scrubber::-webkit-slider-thumb {
        -webkit-appearance: none;
        height: 20px;
        width: 20px;
        border-radius: 50%;
        background-color: #fff;
        background-image: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512"><path fill="%23ffffff" d="M256 512c141.4 0 256-114.6 256-256S397.4 0 256 0 0 114.6 0 256s114.6 256 256 256z"/><path fill="%231a2235" d="M156.4 125.7l-47.5 81.3 46 88.5h91l46.2-88.5-47.6-81.3h-88.1zm178.2 26.6l38.2 24.3-17.6 65.6-58.4-18.4 37.8-71.5zM128 176.6l-38.2-24.3L107.4 86.7l58.4 18.4-37.8 71.5zm195.4 125l51.5 68.2-56 55.4-80-28.4-38.3-80.4 122.8-14.8zm-134.8 0l-51.5 68.2 56 55.4 80-28.4 38.3-80.4-122.8-14.8z"/></svg>');
        background-size: cover;
        margin-top: -7px;
        box-shadow: 0 0 15px rgba(0, 229, 255, 0.8),
          0 0 5px rgba(255, 51, 102, 0.8);
        transition: transform 0.1s;
      }
      input[type="range"].fifa-scrubber:hover::-webkit-slider-thumb {
        transform: scale(1.2);
      }

      input[type="range"].vol-scrubber::-webkit-slider-thumb {
        -webkit-appearance: none;
        height: 12px;
        width: 12px;
        border-radius: 50%;
        background-color: #fff;
        margin-top: -3px;
      }
    </style>
  </head>

  <body

  >

          >
            Start Watching
          </button>
          <a
            href="https://shadik.onrender.com/business"
            target="_blank"
            class="w-full bg-white/5 border border-white/10 hover:bg-white/10 text-white font-medium py-3 px-6 rounded-xl transition-all duration-300 text-sm"

            View Portfolio
          </a>

      </div>
    </div>

    <!-- DUAL BACKGROUND LAYER -->
    <div class="absolute inset-0 z-0 bg-dark-base pointer-events-none">

      <div

      <div

      <div

      ></div>
      <div
        class="absolute bottom-[10%] right-[10%] w-[250px] md:w-[400px] h-[250px] md:h-[400px] bg-wc-turquoise/10 blur-[100px] md:blur-[140px] rounded-full z-10"
      ></div>
    </div>

    <!-- SIDEBAR / BOTTOM NAV -->
    <aside
      class="order-2 md:order-1 w-full h-[70px] md:h-full md:w-[76px] bg-dark-sidebar/80 md:bg-dark-sidebar flex flex-row md:flex-col items-center justify-around md:justify-start py-0 md:py-8 z-50 border-t md:border-t-0 md:border-r border-white/[0.04] flex-shrink-0 shadow-[0_-5px_20px_rgba(0,0,0,0.6)] md:shadow-[5px_0_20px_rgba(0,0,0,0.8)] relative backdrop-blur-2xl md:backdrop-blur-none"
    >
      <!-- Official FIFA 2026 Logo (Desktop) -->
      <a
        href="https://shadik.onrender.com/business"
        target="_blank"
        class="hidden md:flex cursor-pointer mb-14 hover:scale-110 transition-transform duration-300 items-center justify-center bg-white/5 rounded-full w-12 h-12 shadow-[0_0_15px_rgba(255,255,255,0.1)] p-2 border border-white/10"
      >
        <img

          alt="FIFA 26"

        />

      <nav

        class="flex flex-row md:flex-col gap-1 md:gap-9 w-full justify-around md:justify-start items-center relative z-10 h-full md:h-auto px-2 md:px-0"
      ></nav>

      <!-- User Profile Avatar (Desktop) -->
      <a
        href="https://shadik.onrender.com/business"
        target="_blank"
        class="hidden md:block mt-auto relative group z-10 cursor-pointer hover:scale-110 transition-transform duration-300"
      >
        <div
          class="absolute inset-[-4px] rounded-full blur-[8px] opacity-0 group-hover:opacity-100 transition-opacity animated-border z-0"
        ></div>
        <img
          src="https://i.postimg.cc/yddXd3db/Chat-GPT-Image-Apr-19-2026-08-20-37-PM.png"

          class="w-[38px] h-[38px] rounded-full border-[2px] border-dark-card relative z-10 object-cover bg-dark-card"
        />
      </a>
    </aside>

    <!-- MAIN CONTENT AREA -->
    <main
      class="order-1 md:order-2 flex-1 min-w-0 h-full relative z-20 overflow-hidden"
    >
      <!-- ========================================== -->
      <!-- VIEW 1: LUXURY HOME INTERFACE              -->
      <!-- ========================================== -->
      <div
        id="view-home"
        class="app-view active-state absolute inset-0 w-full h-full flex flex-col px-5 sm:px-8 md:px-12 pt-6 md:pt-10 pb-2 md:pb-0 overflow-y-auto md:overflow-hidden no-scrollbar"
      >
        <header
          class="flex flex-col md:flex-row justify-between items-start md:items-center w-full md:pr-6 gap-4 md:gap-0 relative z-30 shrink-0"
        >
          <div class="flex justify-between items-center w-full md:w-auto">
            <div class="flex items-center gap-3 md:gap-4">
              <!-- Official FIFA 2026 Logo (Mobile) -->
              <a
                href="https://shadik.onrender.com/business"
                target="_blank"
                class="md:hidden flex items-center justify-center bg-white/5 rounded-full w-8 h-8 shadow-[0_0_10px_rgba(255,255,255,0.1)] p-1.5 border border-white/10 mr-1"
              >
                <img
                  src="https://upload.wikimedia.org/wikipedia/en/1/17/2026_FIFA_World_Cup_emblem.svg"
                  alt="FIFA 26"
                  class="w-full h-full object-contain"
                />
              </a>
              <h2
                class="text-[12px] md:text-[11px] font-bold tracking-[0.2em] md:tracking-[0.25em] text-dark-text uppercase"
              >
                Live Channels
              </h2>
              <span
                id="game-counter"
                class="text-[12px] font-bold text-dark-text/40"
              ></span>
            </div>

            <!-- Mobile Avatar -->
            <a
              href="https://shadik.onrender.com/business"
              target="_blank"
              class="md:hidden relative group cursor-pointer z-10"
            >
              <div
                class="absolute inset-[-2px] rounded-full blur-[4px] animated-border opacity-70 z-0"
              ></div>
              <img
                src="https://i.postimg.cc/yddXd3db/Chat-GPT-Image-Apr-19-2026-08-20-37-PM.png"
                alt="Profile"
                class="w-[32px] h-[32px] rounded-full border-[1.5px] border-dark-card relative z-10 object-cover bg-dark-card"
              />
            </a>
          </div>

          <div
            class="bg-white/[0.04] border border-white/5 backdrop-blur-xl focus-within:border-wc-turquoise/60 focus-within:bg-white/[0.08] flex items-center px-4 py-3 md:py-2.5 rounded-xl md:rounded-md w-full md:w-[300px] transition-all duration-300"
          >
            <input
              id="search-input"
              type="text"
              placeholder="Search live sports..."
              class="bg-transparent border-none outline-none text-[13px] text-white placeholder:text-dark-text/60 w-full"
            />
            <i
              class="fa-solid fa-magnifying-glass text-dark-text text-[13px] ml-2"
            ></i>
          </div>
        </header>

        <div
          class="flex-1 flex flex-col justify-center mt-6 md:mt-4 relative z-20 shrink-0 min-h-[160px]"
        >
          <div id="hero-content" class="hero-transition hero-enter w-full">
            <!-- Populated by JS -->
          </div>
        </div>

        <div class="w-full relative mt-auto z-30 shrink-0">
          <div
            id="carousel-track"
            class="flex flex-nowrap items-end gap-[12px] md:gap-[20px] w-full overflow-x-auto pt-6 pb-4 md:pt-16 md:pb-12 scroll-smooth relative pointer-events-auto"
          >
            <!-- Cards populated by JS -->
          </div>
        </div>

        id="view-player"
        class="app-view hidden-state absolute inset-0 w-full h-full bg-dark-base flex flex-col overflow-hidden"
      >
        <div
          class="hidden md:flex w-full items-center justify-between px-8 py-6 shrink-0 z-40"
        >
          <button
            onclick="goHome()"
            class="flex items-center gap-3 text-dark-text hover:text-white transition-colors duration-300 group"
          >
            <div

              <i class="fa-solid fa-arrow-left"></i>
            </div>
            <span class="text-[11px] font-bold tracking-[0.2em] uppercase"

            >

        </div>

            class="contents lg:flex flex-col w-full lg:w-[65%] xl:w-[70%] shrink-0 lg:h-full lg:overflow-y-auto no-scrollbar lg:pr-8 lg:pl-8"

                          max="1"
                          step="0.05"
                          value="1"

                      </div>

                      <div class="flex items-center gap-1.5 ml-2">
                        <div
                          class="w-2 h-2 rounded-full bg-red-500 animate-pulse"
                        ></div>
                        <span
                          class="text-white text-[11px] font-bold tracking-[0.1em] uppercase drop-shadow-md"

                        >
                        <span
                          id="time-display"
                          class="text-white/60 text-[10px] ml-1"
                        ></span>
                      </div>
                    </div>

                    <div class="flex items-center gap-4 relative">
                      <button
                        id="quality-btn"
                        class="text-white hover:text-wc-turquoise transition-colors w-6 h-6 flex items-center justify-center relative"
                      >
                        <i class="fa-solid fa-gear"></i>
                      </button>

                      <button
                        id="fullscreen-btn"
                        class="text-white hover:text-wc-turquoise transition-colors w-6 h-6 flex items-center justify-center"
                      >
                        <i class="fa-solid fa-expand"></i>
                      </button>
                    </div>
                  </div>
                </div>

        videoElement.removeAttribute("src");

      // --- 4. PLAYER & RELATED LIST LOGIC ---
      window.loadPlayerChannel = function (id) {
        activeId = id;
        const channel = channelsData.find((g) => g.id === id);

        // Update Info (Using channel.title for the animated text!)
        document.getElementById("player-title").innerHTML = channel.title;
        document.getElementById("player-category").innerText = channel.category;

        videoLoader.classList.remove("opacity-0", "pointer-events-none");
        playPauseBtn.innerHTML = '<i class="fa-solid fa-pause text-lg"></i>';
        qualityMenu.classList.add("hidden");
        qualityMenu.innerHTML = "";
        qualityBtn.style.display = "flex";
        updateProgressTrack(100);

        if (hlsInstance) {
          hlsInstance.destroy();
        }

        if (Hls.isSupported()) {
          hlsInstance = new Hls({
            enableWorker: true,
            lowLatencyMode: true,
            backBufferLength: 90,
          });

          hlsInstance.loadSource(channel.url);
          hlsInstance.attachMedia(videoElement);

          hlsInstance.on(Hls.Events.MANIFEST_PARSED, function (event, data) {
            videoElement.play().catch(() => {});
            videoLoader.classList.add("opacity-0", "pointer-events-none");
            buildQualityMenu(data.levels);
            resetControlsTimeout();
          });

          hlsInstance.on(Hls.Events.ERROR, function (event, data) {
            if (data.fatal) {
              switch (data.type) {
                case Hls.ErrorTypes.NETWORK_ERROR:
                  hlsInstance.startLoad();
                  break;
                case Hls.ErrorTypes.MEDIA_ERROR:
                  hlsInstance.recoverMediaError();
                  break;
                default:
                  hlsInstance.destroy();
                  videoLoader.classList.remove(
                    "opacity-0",
                    "pointer-events-none",
                  );
                  videoLoader.innerHTML = `<span class="text-wc-coral text-[10px] md:text-xs font-bold tracking-[0.2em] uppercase mt-5">Stream Offline</span>`;
                  break;
              }
            }
          });
        } else if (videoElement.canPlayType("application/vnd.apple.mpegurl")) {
          videoElement.src = channel.url;
          videoElement.addEventListener(
            "loadedmetadata",
            function () {
              videoElement.play().catch(() => {});
              videoLoader.classList.add("opacity-0", "pointer-events-none");
              resetControlsTimeout();
            },
            { once: true },
          );
        }

        const relatedList = document.getElementById("related-list");
        relatedList.innerHTML = channelsData
          .map((ch) => {
            const isActive = ch.id === id;
            return `
                <div onclick="loadPlayerChannel('${
                  ch.id
                }')" class="flex gap-4 p-2.5 rounded-xl cursor-pointer transition-all duration-300 group ${
              isActive
                ? "bg-dark-card border border-white/10"
                : "hover:bg-white/5 border border-transparent"
            }">
                    <div class="w-28 md:w-32 aspect-video bg-[#0a0a0c] rounded-lg overflow-hidden relative border ${
                      isActive
                        ? "border-wc-coral shadow-[0_0_15px_rgba(255,51,102,0.3)]"
                        : "border-white/5"
                    } shrink-0 flex items-center justify-center">
                        <img src="${
                          ch.logo
                        }" class="w-full h-full object-contain p-2 ${
              !isActive ? "group-hover:scale-110" : ""
            } transition-transform duration-500 bg-[#0a0a0c]">
                        ${
                          isActive
                            ? `
                            <div class="absolute bottom-1 right-1 bg-wc-coral text-white text-[8px] font-black px-1.5 py-0.5 rounded flex items-center gap-1 uppercase shadow-[0_0_10px_rgba(255,51,102,0.8)]">
                                <div class="w-1 h-1 bg-white rounded-full animate-ping"></div> PLAYING
                            </div>
                        `
                            : `
                            <span class="absolute bottom-1 right-1 bg-red-600 text-white text-[8px] font-bold px-1.5 py-0.5 rounded uppercase shadow-md">LIVE</span>
                        `
                        }
                    </div>
                    <div class="flex flex-col justify-center min-w-0 pr-2">
                        <h4 class="${
                          isActive ? "text-wc-coral" : "text-white"
                        } font-bold text-xs md:text-sm leading-tight truncate group-hover:text-wc-turquoise transition-colors duration-300">${
              ch.cleanTitle
            }</h4>
                        <p class="text-dark-text text-[9px] md:text-[10px] tracking-widest mt-1.5 uppercase">${
                          ch.category
                        }</p>
                    </div>
                </div>
                `;
          })
          .join("");

        if (window.innerWidth < 1024)
          window.scrollTo({ top: 0, behavior: "smooth" });
      };

      // --- 5. CUSTOM VIDEO CONTROLS & SMART AUTO-HIDE LOGIC ---
      function resetControlsTimeout() {
        videoContainer.classList.add("controls-active");
        clearTimeout(hideControlsTimeout);

        if (!videoElement.paused) {
          hideControlsTimeout = setTimeout(() => {
            videoContainer.classList.remove("controls-active");
            qualityMenu.classList.add("hidden");
          }, 3000);
        }
      }

      videoContainer.addEventListener("mousemove", () => {
        if (window.innerWidth >= 1024) resetControlsTimeout();
      });

      videoElement.addEventListener("click", (e) => {
        if (window.innerWidth < 1024) {
          if (videoContainer.classList.contains("controls-active")) {
            videoContainer.classList.remove("controls-active");
            qualityMenu.classList.add("hidden");
            clearTimeout(hideControlsTimeout);
          } else {
            resetControlsTimeout();
          }
        } else {
          if (videoElement.paused) videoElement.play();
          else videoElement.pause();
          resetControlsTimeout();
        }
      });

      function updateProgressTrack(val) {
        progressBar.style.background = `linear-gradient(to right, #FF3366 0%, #8A2BE2 ${
          val * 0.33
        }%, #00E5FF ${
          val * 0.66
        }%, #CCFF00 ${val}%, rgba(255,255,255,0.1) ${val}%, rgba(255,255,255,0.1) 100%)`;
      }

      videoElement.addEventListener("timeupdate", () => {
        if (videoElement.duration && videoElement.duration !== Infinity) {
          const percent =
            (videoElement.currentTime / videoElement.duration) * 100;
          progressBar.value = percent;
          updateProgressTrack(percent);

          let mins = Math.floor(videoElement.currentTime / 60);
          let secs = Math.floor(videoElement.currentTime % 60);
          timeDisplay.innerText = `${mins}:${secs < 10 ? "0" : ""}${secs}`;
        } else {
          progressBar.value = 100;
          updateProgressTrack(100);
        }
      });

      progressBar.addEventListener("input", (e) => {
        if (videoElement.duration && videoElement.duration !== Infinity) {
          const time = (e.target.value / 100) * videoElement.duration;
          videoElement.currentTime = time;
          updateProgressTrack(e.target.value);
        }
        resetControlsTimeout();
      });

      playPauseBtn.addEventListener("click", () => {
        if (videoElement.paused) videoElement.play();
        else videoElement.pause();
        resetControlsTimeout();
      });

      videoElement.addEventListener("play", () => {
        playPauseBtn.innerHTML = '<i class="fa-solid fa-pause text-lg"></i>';
        resetControlsTimeout();
      });
      videoElement.addEventListener("pause", () => {
        playPauseBtn.innerHTML = '<i class="fa-solid fa-play text-lg"></i>';
        clearTimeout(hideControlsTimeout);
        videoContainer.classList.add("controls-active");
      });

      volumeBar.addEventListener("input", (e) => {
        videoElement.volume = e.target.value;
        resetControlsTimeout();
      });

      fullscreenBtn.addEventListener("click", async () => {
        if (!document.fullscreenElement) {
          if (videoContainer.requestFullscreen)
            await videoContainer.requestFullscreen();
          else if (videoContainer.webkitRequestFullscreen)
            videoContainer.webkitRequestFullscreen();

          try {
            if (screen.orientation && screen.orientation.lock)
              await screen.orientation.lock("landscape");
          } catch (e) {}
          fullscreenBtn.innerHTML = '<i class="fa-solid fa-compress"></i>';
        } else {
          if (document.exitFullscreen) document.exitFullscreen();
          else if (document.webkitExitFullscreen)
            document.webkitExitFullscreen();

          try {
            if (screen.orientation && screen.orientation.unlock)
              screen.orientation.unlock();
          } catch (e) {}
          fullscreenBtn.innerHTML = '<i class="fa-solid fa-expand"></i>';
        }
      });

      document.addEventListener("fullscreenchange", () => {
        if (!document.fullscreenElement) {
          fullscreenBtn.innerHTML = '<i class="fa-solid fa-expand"></i>';
          try {
            screen.orientation.unlock();
          } catch (e) {}
        }
      });

      qualityBtn.addEventListener("click", (e) => {
        e.stopPropagation();
        qualityMenu.classList.toggle("hidden");
        resetControlsTimeout();
      });

      function buildQualityMenu(levels) {
        if (!levels || levels.length <= 1) {
          qualityBtn.style.display = "none";
          qualityMenu.innerHTML = "";
          return;
        }
        qualityBtn.style.display = "flex";
        qualityMenu.innerHTML = `<button onclick="setQuality(-1)" class="text-[11px] font-bold tracking-wider text-white hover:text-wc-turquoise hover:bg-white/10 text-left px-4 py-2 w-full transition-colors border-b border-white/5">AUTO</button>`;
        levels.forEach((level, index) => {
          if (level.height) {
            qualityMenu.innerHTML += `<button onclick="setQuality(${index})" class="text-[11px] font-bold tracking-wider text-white hover:text-wc-turquoise hover:bg-white/10 text-left px-4 py-2 w-full transition-colors">${level.height}p</button>`;
          }
        });
      }

      window.setQuality = function (levelIndex) {
        if (hlsInstance) hlsInstance.currentLevel = levelIndex;
        qualityMenu.classList.add("hidden");
      };

      // --- 6. SEARCH & NAV ---
      searchInput.addEventListener("input", (e) => {
        renderCarousel(e.target.value);
      });

      const icons = [
        { icon: "fa-house", id: "home", active: true },
        { icon: "fa-tv", id: "live" },
        { icon: "fa-layer-group", id: "library" },
        { icon: "fa-gear", id: "settings" },
      ];

      document.getElementById("sidebar-nav").innerHTML = icons
        .map(
          (item) => `
            <button class="relative w-12 md:w-full h-full md:h-auto flex items-center justify-center transition-all duration-300 group ${
              item.active ? "text-white" : "text-dark-text hover:text-white"
            }" id="nav-${item.id}" onclick="handleNavClick('${item.id}')">
                <div class="hidden md:block absolute left-0 top-1/2 -translate-y-1/2 w-[3px] h-6 rounded-r-md animated-border nav-indicator-desktop ${
                  item.active ? "opacity-100" : "opacity-0"
                } transition-opacity duration-300 shadow-[0_0_15px_rgba(0,229,255,0.8)]"></div>
                <div class="block md:hidden absolute top-0 left-1/2 -translate-x-1/2 w-6 h-[3px] rounded-b-md animated-border nav-indicator-mobile ${
                  item.active ? "opacity-100" : "opacity-0"
                } transition-opacity duration-300 shadow-[0_0_15px_rgba(0,229,255,0.8)]"></div>
                <i class="fa-solid ${
                  item.icon
                } text-[20px] transition-transform duration-300 ${
            item.active
              ? "scale-110 drop-shadow-[0_0_10px_rgba(255,255,255,0.5)]"
              : "group-hover:scale-110"
          }"></i>
            </button>
        `,
        )
        .join("");

      window.setNav = function (id) {
        document.querySelectorAll("#sidebar-nav button").forEach((btn) => {
          btn.classList.replace("text-white", "text-dark-text");
          btn
            .querySelector("i")
            .classList.remove(
              "scale-110",
              "drop-shadow-[0_0_10px_rgba(255,255,255,0.5)]",
            );
          const indDesk = btn.querySelector(".nav-indicator-desktop");
          const indMob = btn.querySelector(".nav-indicator-mobile");
          if (indDesk) indDesk.classList.replace("opacity-100", "opacity-0");
          if (indMob) indMob.classList.replace("opacity-100", "opacity-0");
        });
        const active = document.getElementById(`nav-${id}`);
        if (active) {
          active.classList.replace("text-dark-text", "text-white");
          active
            .querySelector("i")
            .classList.add(
              "scale-110",
              "drop-shadow-[0_0_10px_rgba(255,255,255,0.5)]",
            );
          const activeIndDesk = active.querySelector(".nav-indicator-desktop");
          const activeIndMob = active.querySelector(".nav-indicator-mobile");
          if (activeIndDesk)
            activeIndDesk.classList.replace("opacity-0", "opacity-100");
          if (activeIndMob)
            activeIndMob.classList.replace("opacity-0", "opacity-100");
        }
      };

      window.handleNavClick = function (id) {
        if (id === "home") goHome();
        else if (id === "live") openPlayer();
        else setNav(id);
      };

      // --- INIT ---
      bgLayers[0].src = channelsData[0].bg;
      renderCarousel();
      // selectChannelHome("cazebr");

      window.addEventListener("resize", () => {
        const card = document.getElementById(`card-${activeId}`);
        if (card && track && viewHome.classList.contains("active-state")) {
          const cardWidth = window.innerWidth < 768 ? 180 : 290;
          track.scrollLeft =
            card.offsetLeft - track.clientWidth / 2 + cardWidth / 2;
        }
      });
    </script>
  </body>
</html>
