<!DOCTYPE html>
<html lang="en" class="dark scroll-smooth">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Md Shadik Hossain Talukder — Official Document Vault</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <!-- Inter Font -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <script>
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            fontFamily: {
              sans: ['"Inter"', "sans-serif"],
            },
            colors: {
              obsidian: "#09090b",
              surface: "#121215",
              "surface-subtle": "#18181c",
              border: "rgba(255, 255, 255, 0.08)",
            },
          },
        },
      };
    </script>
    <style>
      body {
        background-color: #09090b;
        color: #f4f4f5;
        font-feature-settings: "cv02", "cv03", "cv04", "cv11";
      }
      .no-scrollbar::-webkit-scrollbar {
        display: none;
      }
      .no-scrollbar {
        -ms-overflow-style: none;
        scrollbar-width: none;
      }
      .vault-card {
        background: linear-gradient(
          180deg,
          rgba(24, 24, 28, 0.6) 0%,
          rgba(18, 18, 21, 0.8) 100%
        );
        border: 1px solid rgba(255, 255, 255, 0.07);
        backdrop-filter: blur(14px);
        transition: all 0.22s cubic-bezier(0.16, 1, 0.3, 1);
      }
      .vault-card:hover {
        border-color: rgba(255, 255, 255, 0.2);
        transform: translateY(-2px);
        box-shadow: 0 12px 28px -10px rgba(0, 0, 0, 0.7);
      }
    </style>
  </head>
  <body
    class="min-h-screen flex flex-col justify-between antialiased selection:bg-white/10 selection:text-white"
  >
    <!-- Ambient Subtle Glow -->
    <div
      class="fixed top-0 left-1/2 -translate-x-1/2 w-full max-w-4xl h-72 bg-white/[0.025] blur-[120px] pointer-events-none -z-10 rounded-full"
    ></div>

    <!-- Main Container -->
    <main class="max-w-4xl mx-auto px-5 sm:px-8 pt-16 pb-24 w-full">
      <!-- Header -->
      <header
        class="flex flex-col lg:flex-row lg:items-end justify-between gap-6 pb-10 border-b border-white/[0.08]"
      >
        <div class="flex items-center gap-5 sm:gap-6">
          <!-- Premium Minimalist Framed Avatar -->
          <div class="relative shrink-0">
            <div
              class="absolute -inset-0.5 rounded-2xl bg-gradient-to-tr from-white/20 via-white/5 to-transparent opacity-80 blur-sm pointer-events-none"
            ></div>
            <div
              class="relative p-1 rounded-2xl bg-gradient-to-b from-white/15 via-white/[0.04] to-transparent border border-white/15 shadow-2xl backdrop-blur-md"
            >
              <img
                id="user-photo"
                src="./my-vault/docs/Md_Shadik_Hossain_Photo.png"
                onerror="this.src='./docs/Md_Shadik_Hossain_Photo.png'"
                alt="Md Shadik Hossain Talukder"
                class="w-20 h-20 sm:w-24 sm:h-24 rounded-xl object-cover"
              />
            </div>
            <span
              class="absolute -bottom-1 -right-1 w-4 h-4 bg-emerald-500 rounded-full border-2 border-obsidian ring-2 ring-emerald-500/20 shadow-sm"
              title="Verified Dossier"
            ></span>
          </div>

          <!-- Name & Details Block -->
          <div class="min-w-0">
            <div class="flex flex-wrap items-center gap-2.5">
              <h1
                class="text-xl sm:text-2xl md:text-3xl font-semibold tracking-tight text-white whitespace-nowrap"
              >
                Md Shadik Hossain Talukder
              </h1>
              <span
                class="inline-flex items-center gap-1 text-[11px] font-medium text-emerald-400 bg-emerald-500/10 px-2.5 py-0.5 rounded-full border border-emerald-500/20 whitespace-nowrap shrink-0"
              >
                <i
                  data-lucide="shield-check"
                  class="w-3 h-3 text-emerald-400"
                ></i>
                Verified
              </span>
            </div>

            <!-- Verified Online Presence Links -->
            <div class="flex items-center gap-2 mt-3.5">
              <!-- LinkedIn Link -->
              <a
                href="https://www.linkedin.com/in/md-shadik-hossain-talukder-41b064346"
                target="_blank"
                rel="noopener noreferrer"
                class="inline-flex items-center gap-1.5 text-xs text-zinc-300 hover:text-white px-2.5 py-1 rounded-lg bg-white/[0.03] border border-white/[0.06] hover:border-white/20 transition whitespace-nowrap group"
              >
                <svg
                  class="w-3.5 h-3.5 fill-[#0A66C2] group-hover:brightness-110 transition shrink-0"
                  viewBox="0 0 24 24"
                >
                  <path
                    d="M19 3a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h14m-.5 15.5v-5.3a3.26 3.26 0 0 0-3.26-3.26c-.85 0-1.84.52-2.28 1.3v-1.11h-2.79v8.37h2.79v-4.93c0-.77.62-1.4 1.39-1.4a1.4 1.4 0 0 1 1.4 1.4v4.93h2.75M6.46 10.9v8.37H9.2V10.9H6.46M7.83 6.45a1.6 1.6 0 0 0-1.6 1.6 1.6 1.6 0 0 0 1.6 1.6 1.6 1.6 0 0 0 1.6-1.6 1.6 1.6 0 0 0-1.6-1.6Z"
                  />
                </svg>
                <span>LinkedIn</span>
              </a>

              <!-- Live Portfolio Link -->
              <a
                href="https://shadik.onrender.com/personal"
                target="_blank"
                rel="noopener noreferrer"
                class="inline-flex items-center gap-1.5 text-xs text-zinc-300 hover:text-white px-2.5 py-1 rounded-lg bg-white/[0.03] border border-white/[0.06] hover:border-white/20 transition whitespace-nowrap"
              >
                <i data-lucide="globe" class="w-3.5 h-3.5 text-emerald-400"></i>
                <span>Portfolio</span>
              </a>
            </div>
          </div>
        </div>

        <!-- Global Action Bar -->
        <div
          class="flex items-center gap-2.5 shrink-0 w-full lg:w-auto mt-2 lg:mt-0"
        >
          <button
            onclick="copyDossierLink()"
            class="flex-1 lg:flex-initial inline-flex items-center justify-center gap-2 text-xs font-medium text-zinc-300 hover:text-white bg-white/[0.04] border border-white/[0.08] hover:border-white/20 px-4 py-2.5 rounded-xl transition whitespace-nowrap"
          >
            <i data-lucide="share-2" class="w-3.5 h-3.5"></i>
            <span id="copy-btn-text">Share Vault</span>
          </button>
          <button
            onclick="downloadAllFiles()"
            class="flex-1 lg:flex-initial inline-flex items-center justify-center gap-2 text-xs font-semibold bg-white text-zinc-950 px-4 py-2.5 rounded-xl hover:bg-zinc-200 transition shadow-sm whitespace-nowrap"
          >
            <i data-lucide="download" class="w-3.5 h-3.5"></i>
            <span>Download All (14)</span>
          </button>
        </div>
      </header>

      <!-- Segmented Filter Rail (Single Line, No Wrap) -->
      <section class="py-7">
        <div class="overflow-x-auto no-scrollbar py-1">
          <nav
            class="inline-flex items-center p-1 rounded-2xl bg-white/[0.03] border border-white/[0.07] backdrop-blur-xl"
          >
            <button
              onclick="filterCategory('all', this)"
              class="filter-tab active px-3.5 py-1.5 rounded-xl text-xs font-medium whitespace-nowrap bg-white text-zinc-950 transition duration-150"
            >
              All Records <span class="ml-1 opacity-60 text-[10px]">14</span>
            </button>
            <button
              onclick="filterCategory('identity', this)"
              class="filter-tab px-3.5 py-1.5 rounded-xl text-xs font-medium whitespace-nowrap text-zinc-400 hover:text-white transition duration-150"
            >
              Identity & Family
            </button>
            <button
              onclick="filterCategory('academics', this)"
              class="filter-tab px-3.5 py-1.5 rounded-xl text-xs font-medium whitespace-nowrap text-zinc-400 hover:text-white transition duration-150"
            >
              SSC & HSC
            </button>
            <button
              onclick="filterCategory('documents', this)"
              class="filter-tab px-3.5 py-1.5 rounded-xl text-xs font-medium whitespace-nowrap text-zinc-400 hover:text-white transition duration-150"
            >
              Other Records
            </button>
          </nav>
        </div>
      </section>

      <!-- Document Grid -->
      <section
        id="documents-grid"
        class="grid grid-cols-1 md:grid-cols-2 gap-3.5"
      >
        <!-- Populated by JavaScript -->
      </section>
    </main>

    <!-- Unified Preview Modal (Handles PDF, JPG, PNG) -->
    <div
      id="preview-modal"
      class="fixed inset-0 z-50 bg-black/85 backdrop-blur-md hidden flex items-center justify-center p-4"
    >
      <div
        class="bg-surface border border-white/[0.1] w-full max-w-4xl h-[88vh] rounded-3xl flex flex-col overflow-hidden shadow-2xl"
      >
        <!-- Modal Header -->
        <div
          class="flex items-center justify-between px-6 py-4 border-b border-white/[0.08] bg-white/[0.02]"
        >
          <div class="flex items-center gap-3">
            <div
              class="p-2 rounded-lg bg-white/[0.05] border border-white/[0.08]"
            >
              <i data-lucide="file-text" class="w-4 h-4 text-zinc-300"></i>
            </div>
            <div>
              <h3
                id="modal-title"
                class="text-xs font-medium text-white truncate max-w-md"
              >
                Document Preview
              </h3>
              <p id="modal-meta" class="text-[11px] text-zinc-400">
                Verified Document
              </p>
            </div>
          </div>
          <div class="flex items-center gap-2">
            <a
              id="modal-download"
              href="#"
              download
              class="p-2 rounded-xl bg-white/[0.04] text-zinc-300 hover:text-white hover:bg-white/[0.08] border border-white/[0.06] transition"
              title="Download"
            >
              <i data-lucide="download" class="w-4 h-4"></i>
            </a>
            <button
              onclick="closeModal()"
              class="p-2 rounded-xl bg-white/[0.04] text-zinc-300 hover:text-white hover:bg-white/[0.08] border border-white/[0.06] transition"
            >
              <i data-lucide="x" class="w-4 h-4"></i>
            </button>
          </div>
        </div>
        <!-- Modal Body -->
        <div
          class="flex-1 bg-black/60 p-2 overflow-auto flex items-center justify-center"
        >
          <iframe
            id="preview-frame"
            src=""
            class="w-full h-full rounded-2xl border-0 bg-white/5 hidden"
          ></iframe>
          <img
            id="preview-image"
            src=""
            alt="Document Preview"
            class="max-h-full max-w-full rounded-2xl object-contain hidden"
          />
        </div>
      </div>
    </div>

    <!-- Footer -->
    <footer class="border-t border-white/[0.06] py-8 text-center">
      <p class="text-xs text-zinc-500 font-light">
        Md Shadik Hossain Talukder &bull; Document Vault
      </p>
    </footer>

    <!-- Data Engine -->
    <script>
      const BASE_DIR = "./my-vault/docs/";

      const documents = [
        // ================= 1. IDENTITY & FAMILY =================
        {
          id: "passport",
          title: "Passport",
          category: "identity",
          type: "PDF",
          size: "2.3 MB",
          meta: "Md Shadik Hossain Talukder",
          fileName: "Passport - Md Shadik Hossain Talukder.pdf",
          icon: "book-open",
        },
        {
          id: "photo",
          title: "Shadik's Photo",
          category: "identity",
          type: "PNG",
          size: "1.4 MB",
          meta: "Passport Size Photograph",
          fileName: "Md_Shadik_Hossain_Photo.png",
          icon: "user",
        },
        {
          id: "nid",
          title: "National ID (NID)",
          category: "identity",
          type: "PDF",
          size: "2.8 MB",
          meta: "Smart NID Card",
          fileName: "MdShadikHossain_NID.pdf",
          icon: "credit-card",
        },
        {
          id: "birth-cert",
          title: "Birth Certificate",
          category: "identity",
          type: "PDF",
          size: "4.7 MB",
          meta: "English Version",
          fileName: "MdShadikHossain_Birth_Certificate.pdf",
          icon: "file-check",
        },
        {
          id: "father-nid",
          title: "Father's National ID",
          category: "identity",
          type: "PDF",
          size: "258 KB",
          meta: "Father - NID Card",
          fileName: "Father - NID.pdf",
          icon: "users",
        },
        {
          id: "mother-nid",
          title: "Mother's National ID",
          category: "identity",
          type: "PDF",
          size: "261 KB",
          meta: "Mother - NID Card",
          fileName: "Mother - NID..pdf",
          icon: "users",
        },

        // ================= 2. SSC & HSC ACADEMICS =================
        {
          id: "ssc-cert",
          title: "SSC Certificate",
          category: "academics",
          type: "PDF",
          size: "129 KB",
          meta: "Secondary School Certificate",
          fileName: "MdShadikHossain_SSC_Certificate.pdf",
          icon: "file-text",
        },
        {
          id: "ssc-trans",
          title: "SSC Transcript",
          category: "academics",
          type: "PDF",
          size: "4.8 MB",
          meta: "SSC Academic Transcript",
          fileName: "MdShadikHossain_SSC_Transcript.pdf",
          icon: "file-spreadsheet",
        },
        {
          id: "ssc-scholarship",
          title: "SSC Talentpool Scholarship",
          category: "academics",
          type: "JPG",
          size: "197 KB",
          meta: "Ministry of Education Award",
          fileName: "talentpool_scholarship_transcript.jpg",
          icon: "sparkles",
        },
        {
          id: "hsc-cert",
          title: "HSC Certificate",
          category: "academics",
          type: "PDF",
          size: "4.1 MB",
          meta: "Higher Secondary Certificate",
          fileName: "MdShadikHossain_HSC_Certificate.pdf",
          icon: "file-text",
        },
        {
          id: "hsc-trans",
          title: "HSC Transcript",
          category: "academics",
          type: "PDF",
          size: "4.8 MB",
          meta: "HSC Academic Transcript",
          fileName: "MdShadikHossain_HSC_Transcript.pdf",
          icon: "file-spreadsheet",
        },
        {
          id: "testimonial",
          title: "Academic Testimonial",
          category: "academics",
          type: "PDF",
          size: "4.0 MB",
          meta: "College Testimonial Letter",
          fileName: "MdShadikHossain_Testimonial.pdf",
          icon: "award",
        },
        // ================= 3. OTHER RECORDS =================
        {
          id: "handwritten",
          title: "Handwritten Statement",
          category: "documents",
          type: "PDF",
          size: "68 KB",
          meta: "Handwritten Document",
          fileName: "Handwritten.pdf",
          icon: "pen-tool",
        },
        {
          id: "anthem-cert",
          title: "National Anthem Certificate",
          category: "academics",
          type: "PNG",
          size: "1.3 MB",
          meta: "Award Certificate",
          fileName: "national_anthem_certificate.png",
          icon: "trophy",
        },
      ];

      function getDocPath(fileName) {
        return encodeURI(BASE_DIR + fileName);
      }

      const grid = document.getElementById("documents-grid");

      function renderDocs(items) {
        grid.innerHTML = "";
        items.forEach((doc) => {
          const fullPath = getDocPath(doc.fileName);
          const card = document.createElement("div");
          card.className =
            "vault-card p-5 rounded-2xl flex flex-col justify-between";
          card.innerHTML = `
                    <div>
                        <div class="flex items-center justify-between gap-2 mb-3">
                            <span class="inline-flex items-center gap-1.5 text-[10px] font-mono uppercase tracking-wider text-zinc-400 bg-white/[0.04] px-2 py-0.5 rounded-md border border-white/[0.05]">
                                ${doc.type} &bull; ${doc.size}
                            </span>
                            <span class="text-[11px] font-medium text-emerald-400/90 flex items-center gap-1">
                                <i data-lucide="check" class="w-3 h-3"></i> Ready
                            </span>
                        </div>
                        
                        <div class="flex items-start gap-3.5">
                            <div class="p-2.5 rounded-xl bg-white/[0.03] border border-white/[0.08] text-zinc-300">
                                <i data-lucide="${doc.icon}" class="w-4 h-4"></i>
                            </div>
                            <div class="min-w-0 flex-1">
                                <h2 class="text-sm font-medium text-white truncate leading-snug">${doc.title}</h2>
                                <p class="text-xs text-zinc-400 mt-0.5 truncate">${doc.meta}</p>
                            </div>
                        </div>
                    </div>
                    
                    <div class="flex items-center justify-end gap-2 pt-4 mt-5 border-t border-white/[0.05]">
                        <button onclick="openPreview('${doc.id}')" class="px-3 py-1.5 rounded-lg text-xs font-medium text-zinc-300 hover:text-white bg-white/[0.04] hover:bg-white/[0.08] border border-white/[0.06] transition">
                            Preview
                        </button>
                        <a href="${fullPath}" download class="p-1.5 rounded-lg text-zinc-400 hover:text-white bg-white/[0.04] hover:bg-white/[0.08] border border-white/[0.06] transition" title="Download">
                            <i data-lucide="download" class="w-3.5 h-3.5"></i>
                        </a>
                    </div>
                `;
          grid.appendChild(card);
        });
        lucide.createIcons();
      }

      function filterCategory(cat, el) {
        document.querySelectorAll(".filter-tab").forEach((tab) => {
          tab.className =
            "filter-tab px-3.5 py-1.5 rounded-xl text-xs font-medium whitespace-nowrap text-zinc-400 hover:text-white transition duration-150";
        });
        el.className =
          "filter-tab active px-3.5 py-1.5 rounded-xl text-xs font-medium whitespace-nowrap bg-white text-zinc-950 transition duration-150";

        if (cat === "all") {
          renderDocs(documents);
        } else {
          renderDocs(documents.filter((d) => d.category === cat));
        }
      }

      function openPreview(docId) {
        const doc = documents.find((d) => d.id === docId);
        if (!doc) return;

        const path = getDocPath(doc.fileName);
        document.getElementById("modal-title").innerText = doc.title;
        document.getElementById(
          "modal-meta",
        ).innerText = `${doc.type} • ${doc.size}`;
        document.getElementById("modal-download").href = path;

        const frame = document.getElementById("preview-frame");
        const img = document.getElementById("preview-image");

        const isImage =
          doc.fileName.endsWith(".png") ||
          doc.fileName.endsWith(".jpg") ||
          doc.fileName.endsWith(".jpeg");

        if (isImage) {
          frame.classList.add("hidden");
          frame.src = "";
          img.src = path;
          img.classList.remove("hidden");
        } else {
          img.classList.add("hidden");
          img.src = "";
          frame.src = path;
          frame.classList.remove("hidden");
        }

        document.getElementById("preview-modal").classList.remove("hidden");
      }

      function closeModal() {
        document.getElementById("preview-modal").classList.add("hidden");
        document.getElementById("preview-frame").src = "";
        document.getElementById("preview-image").src = "";
      }

      document
        .getElementById("preview-modal")
        .addEventListener("click", function (e) {
          if (e.target === this) closeModal();
        });

      function copyDossierLink() {
        navigator.clipboard.writeText(window.location.href);
        const textSpan = document.getElementById("copy-btn-text");
        textSpan.innerText = "Copied!";
        setTimeout(() => {
          textSpan.innerText = "Share Vault";
        }, 2000);
      }

      function downloadAllFiles() {
        documents.forEach((doc, idx) => {
          setTimeout(() => {
            const link = document.createElement("a");
            link.href = getDocPath(doc.fileName);
            link.download = doc.fileName;
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
          }, idx * 220);
        });
      }

      // Initial render
      renderDocs(documents);
    </script>
  </body>
</html>
